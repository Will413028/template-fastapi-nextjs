name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # pushes to dev and main are never cancelled, so every pushed commit gets a full result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + types + architecture + test + database)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # migrations-immutable compares revisions with the merge-base of HEAD and the event's base
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version-file: backend/pyproject.toml
          enable-cache: false
      # uv.lock in sync, format, ruff, import-linter contracts, pyright strict, vulture, pytest without the db tests,
      # and no revision that already reached the base changed: a pull request's base branch, or for a push the branch's
      # previous tip, so a revision pushed to dev is frozen too (the Go version's rule)
      - name: make check
        env:
          EVENT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=HEAD~1; fi
          make sync check BASE="$base"
      # The db tests start PostgreSQL with testcontainers; they run only here, never on a developer's machine by default
      # (schema equals the Go version's, models equal the revisions, grants, append-only, readiness)
      - run: make test-db
      # suppression comments may only go down and executed tests only up (scripts/quality-locks.json)
      - run: python3 scripts/check_locks.py --pytest-report backend/test-report.xml --pytest-db-report backend/test-db-report.xml
        working-directory: .
      # make migration generates a revision; with the models and revisions in agreement it holds no operation
      - name: make migration generates an empty revision when nothing changed
        run: |
          make migration MSG=ci_probe
          new="$(git status --porcelain --untracked-files=all -- src/app/main/migrations/versions)"
          echo "$new"
          test "$(wc -l <<< "$new")" -eq 1
          file="$(sed 's/^?? backend\///' <<< "$new")"
          grep -q '^def upgrade() -> None:$' "$file"
          test "$(sed -n '/^def upgrade/,$p' "$file" | sed 1d | tr -d ' \n')" = pass

  # Every commit that edits a checker's configuration or moves a lock the bad way names why in a Quality-Gate trailer
  # (scripts/check_commit_policy.py; lefthook checks it at commit time too).
  policy:
    name: Commit policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # every release binary pinned in a Makefile has a version and a checksum per platform
      - run: python3 scripts/tool_versions.py verify
      - name: Check the commits being added
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then range="$BASE..$HEAD_SHA"
          elif git rev-parse -q --verify "$HEAD_SHA~1" > /dev/null; then range="$HEAD_SHA~1..$HEAD_SHA"
          else range="$HEAD_SHA"; fi  # a new branch whose first commit is the root commit
          python3 scripts/check_commit_policy.py --range "$range"

  # Builds the production backend image and starts the stack the VM runs (no tunnel: CI has no token).
  stack:
    name: Compose stack (image + migrate + health)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-docker
      # .env and the password files under .secrets/, as a developer gets them
      - run: make init-env
      # the tunnel profile included, so cloudflared is checked too; its token file is only read when it starts
      - name: Each service gets only its own secrets
        run: |
          touch .secrets/tunnel_token
          docker compose --profile tunnel config --format json > /tmp/compose.json
          test "$(jq -c '.services.backend.secrets | map(.source)' /tmp/compose.json)" = '["db_app_password"]'
          test "$(jq -c '.services.migrate.secrets | map(.source)' /tmp/compose.json)" = '["db_owner_password"]'
          test "$(jq -c '.services.cloudflared.secrets | map(.source)' /tmp/compose.json)" = '["tunnel_token"]'
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --format json > /tmp/compose-dev.json
          test "$(jq -c '.services.frontend.secrets // []' /tmp/compose-dev.json)" = '[]'
          jq -e '.services.frontend.environment' /tmp/compose-dev.json > /dev/null
          if jq -r '.services.frontend.environment | keys[]' /tmp/compose-dev.json | grep -E '^(DATABASE|MIGRATE|POSTGRES|DB_)'; then
            echo "frontend receives database settings"; exit 1
          fi
      # Logs hold client addresses and paths: every service rotates them (docs/privacy/data-inventory.md)
      - name: Every service rotates its logs
        run: test "$(jq -c '[.services | to_entries[] | select(.value.logging.options["max-size"] == null) | .key]' /tmp/compose.json)" = '[]'
      # Published ports bypass ufw: no service may have any; the way in is the Cloudflare Tunnel, which dials out
      - name: No service publishes ports
        run: test "$(jq -c '[.services | to_entries[] | select(.value.ports) | .key]' /tmp/compose.json)" = '[]'
      - run: docker compose up -d --build --wait
      - name: Migrate exited cleanly and backend is ready
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          docker compose logs migrate | grep -q 'at revision baseline'
          docker compose exec -T backend app healthcheck
      - name: The app role cannot change the schema
        run: |
          out="$(docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U template_fastapi_nextjs_app -d template_fastapi_nextjs -c 'CREATE TABLE public.intruder (id int)' 2>&1)" && exit 1
          echo "$out"
          grep -q 'permission denied for schema public' <<< "$out"
      - if: failure()
        run: docker compose logs

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node.js 26 and the pnpm version in package.json's packageManager, then pnpm install --frozen-lockfile with the
      # store cached. pnpm/setup succeeds pnpm/action-setup for pnpm 11 and newer.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          working-directory: frontend
          runtime: node@26
          cache: true
          require-lockfile: true
      - name: Check git hooks were installed
        run: test -x "$(git rev-parse --git-path hooks)/commit-msg"
      - run: pnpm audit --prod --audit-level high
      # src/lib/api/schema.d.ts must match backend/api/openapi.yaml, the contract's single source
      - run: pnpm gen:api:check
      - run: pnpm lint
      - run: pnpm check:deps
      - run: pnpm check:arch
      - run: pnpm test:report
      # suppression comments may only go down and executed tests only up (scripts/quality-locks.json)
      - run: python3 scripts/check_locks.py --vitest-report frontend/test-report.json
        working-directory: .
      - run: pnpm build

  gate:
    # The only required check on main: it passes when every other job in this workflow succeeded or was skipped.
    name: gate (ci)
    if: always()
    needs: [backend, policy, stack, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a needed job ended with: $r"; exit 1 ;; esac
          done

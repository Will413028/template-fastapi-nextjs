[project]
name = "template-fastapi-nextjs-backend"
version = "0.1.0"
description = "FastAPI backend; the HTTP contract is api/openapi.yaml"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    # app.http.validation reads its ValidationError directly; also what openapi-core uses
    "jsonschema==4.26.0",
    "openapi-core==0.23.1",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    # make gen writes src/app/http/contract_models.py from api/openapi.yaml; make gen-check fails when it is stale
    "datamodel-code-generator==0.86.0",
    # make coverage: total and changed-line coverage, reported in CI, not gated (AGENTS.md Verification)
    "diff-cover==11.0.0",
    "httpx2==2.16.0",
    "import-linter==2.15",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
    "vulture==2.16",
]

[tool.coverage.run]
source = ["app"]
# generated from the contract (make gen)
omit = ["*/app/http/contract_models.py"]

# `make gen` reads these: the Pydantic models of the contract's schemas (ADR fastapi-backend-stack D2), written to src/app/http/contract_models.py
# after ruff fixes and formats them, so the generator's own formatting is switched off.
[tool.datamodel-codegen]
input = "api/openapi.yaml"
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.14"
use-annotated = true
field-constraints = true
# Only nullable: true allows null. A field left out of `required` defaults to pydantic.MISSING (stable since Pydantic
# 2.14): the model rejects null where the contract does, a PATCH tells "not sent" (MISSING) from "sent null" (None),
# and a dump leaves out what was not set instead of writing null.
strict-nullable = true
use-missing-sentinel = true
target-pydantic-version = "2.14"
enum-field-as-literal = "all"
# ItemTitle's constraints go inline into the fields that use it, instead of a RootModel to unwrap
collapse-root-models = true
output-datetime-class = "AwareDatetime"
use-schema-description = true
use-field-description = true
use-double-quotes = true
disable-timestamp = true
formatters = ["builtin"]
custom-file-header = """\
# Generated from api/openapi.yaml by `make gen` (options: pyproject.toml [tool.datamodel-codegen]); do not edit.
# `make gen-check` fails when this file no longer matches the contract."""

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name stays `app` in every project made from this template; only the distribution name is renamed.
module-name = "app"

[tool.uv]
# One uv everywhere: CI reads this (astral-sh/setup-uv version-file), and backend/Dockerfile pins the same image tag.
required-version = "==0.13.6"
# Supply-chain cooldown, the same 7 days as Dependabot (.github/dependabot.yml) and pnpm's minimumReleaseAge.
exclude-newer = "7 days"

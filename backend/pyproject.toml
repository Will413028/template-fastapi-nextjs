[project]
name = "template-fastapi-nextjs-backend"
version = "0.1.0"
description = "FastAPI backend; the HTTP contract is generated from the routes into api/openapi.json"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn==0.54.0",
]

[project.scripts]
app = "app.cli:main"

[dependency-groups]
dev = [
    # make coverage: total and changed-line coverage, reported in CI, not gated (AGENTS.md Verification)
    "diff-cover==11.0.0",
    "httpx2==2.16.0",
    "import-linter==2.15",
    # tests/apitest.py checks every response a test receives against the generated contract
    "openapi-core==0.23.1",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.3",
    "testcontainers==4.15.0",
    "vulture==2.16",
]

[tool.coverage.run]
source = ["app"]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The import name stays `app` in every project made from this template; only the distribution name is renamed.
module-name = "app"

[tool.uv]
# One uv everywhere: CI reads this (astral-sh/setup-uv version-file), and backend/Dockerfile pins the same image tag.
required-version = "==0.13.6"
# Supply-chain cooldown, the same 7 days as Dependabot (.github/dependabot.yml) and pnpm's minimumReleaseAge.
exclude-newer = "7 days"

; Editing this file needs a Quality-Gate trailer (scripts/check_commit_policy.py).
[pytest]
testpaths = tests
addopts = --strict-markers --strict-config -ra
xfail_strict = true
; db tests start PostgreSQL in a container: they run only in CI (make test-db), never in this machine's make check
markers =
    db: needs PostgreSQL from testcontainers (tests/dbtest.py); CI only
; A deprecation from an upgrade fails the run instead of scrolling past.
filterwarnings = error

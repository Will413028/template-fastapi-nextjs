# Test contract for the validator and problem tests (from the Go version's internal/httpapi/testdata/test-openapi.yaml):
# real operations only arrive with the auth and items modules. Each Widget property exercises one validation code.
# Additions to the Go file: PATCH /widgets/{id} (application/merge-patch+json, which openapi-core does not parse as
# JSON by default) and a default problem response on every operation, so tests can validate responses too.
openapi: 3.0.3
info:
  title: test
  version: "1"
servers:
  - url: /api
paths:
  /widgets:
    get:
      operationId: listWidgets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: ok
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createWidget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
      responses:
        "201":
          description: created
        default:
          $ref: "#/components/responses/Problem"
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: ok
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateWidget
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/Widget"
      responses:
        "200":
          description: ok
        default:
          $ref: "#/components/responses/Problem"
  /fail:
    get:
      operationId: fail
      responses:
        "200":
          description: ok
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Problem:
      description: any problem
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              detail:
                type: string
              code:
                type: string
              request_id:
                type: string
              errors:
                type: array
                items:
                  type: object
                  required: [pointer, code, detail]
                  properties:
                    pointer:
                      type: string
                    code:
                      type: string
                    detail:
                      type: string
  schemas:
    Widget:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 10
        slug:
          type: string
          pattern: "^[a-z]+$"
        color:
          type: string
          enum: [red, blue]
        ref:
          type: string
          format: uuid
        size:
          type: integer
          minimum: 1
          maximum: 5
        note:
          type: string
        tags:
          type: array
          maxItems: 2
          items:
            type: string
        count:
          type: integer
          multipleOf: 2
        parts:
          type: object
          additionalProperties: false
          properties:
            a/b:
              type: string
              maxLength: 1

# Install scripts run only for the packages listed here.
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  sharp: true
  # Installed by the prepare script instead of its own postinstall.
  lefthook: false

# Skip versions published less than 7 days ago (in minutes), the same cooldown as Dependabot and uv's exclude-newer.
# Setting it explicitly also makes pnpm fail instead of silently falling back to a younger version.
minimumReleaseAge: 10080

# Security fix for a transitive dev dependency (jsdom); drop once jsdom pins >= 8.12.2.
overrides:
  undici: 8.12.2
